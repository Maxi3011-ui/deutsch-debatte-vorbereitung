<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101715">
<meta name="description" content="Deine Debattenvorbereitung: Thema und Rolle auswählen, das passende Rollenpaket lesen. Mit allgemeinen Hinweisen und Apple-Watch-Ansicht.">
<title>Deutsch · Debattenvorbereitung</title>
<link rel="stylesheet" href="style.css?v=no-zoom-1">
<script src="content.js" defer></script>
<script src="app.js?v=no-zoom-1" defer></script>
</head>
<body>
<div class="shell">
<header class="masthead"><p class="eyebrow">Deutsch · Prüfungsmappe</p><h1>Debatte<span class="desktop-title"> vorbereiten.</span></h1><p class="intro">Dein Thema. Deine Rolle. Dein Redeplan.</p></header>
<section class="setup" aria-label="Thema und Rolle auswählen">
<div class="field"><label for="topic">Thema</label><select id="topic"><option value="ki">KI-Entwicklung</option><option value="literatur">Schullektüren</option></select></div>
<div class="field"><label for="role">Meine Position</label><select id="role"><option value="pro1">Pro 1</option><option value="pro2">Pro 2</option><option value="contra1">Contra 1</option><option value="contra2">Contra 2</option></select></div>
<div class="type-controls" role="group" aria-label="Schriftgröße"><button id="smaller" type="button" aria-label="Schrift verkleinern">A−</button><button id="larger" type="button" aria-label="Schrift vergrößern">A+</button><output id="type-status" aria-live="polite">100 %</output></div>
</section>
<nav class="quick-nav" aria-label="Schnellnavigation"><button type="button" data-jump="arguments">Argumente</button><button type="button" data-jump="opening">Eröffnung</button><button type="button" data-jump="general">Allgemeines</button></nav>
<main id="main">
<div id="selection-status" class="selection-status" role="status" aria-live="polite"></div>
<section class="question" aria-labelledby="question-title"><p class="eyebrow">Die Streitfrage</p><h2 id="question-title"></h2><p id="clarification" class="clarification"></p></section>
<article id="role-content" aria-label="Dein Rollenpaket"></article>
<section id="general" aria-labelledby="general-title"><div class="part-heading"><p class="eyebrow">Für jede Rolle</p><h2 id="general-title">Allgemeines</h2></div><div id="general-content"></div></section>
</main>
<footer><p>Deine Prüfungsmappe mit ausformulierten Eröffnungsreden + allgemeinem Teil.</p><button type="button" data-jump="top">Nach oben ↑</button></footer>
<noscript><p>Bitte JavaScript aktivieren, um Thema und Rolle auszuwählen.</p></noscript>
</div>
</body>
</html>
